name: Récupération météo et publication

on:
  schedule:
    # Toutes les 15 minutes. GitHub peut retarder légèrement le déclenchement
    # en cas de forte charge sur son infrastructure (limite connue du cron
    # GitHub Actions, pas un bug de ce workflow).
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: meteo-fetch-deploy
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install requests==2.32.5

      - name: Récupérer les données actuelles
        run: python3 fetch_weather.py

      - name: Combler un éventuel trou (auto-cicatrisation)
        run: python3 seed_history.py

      - name: Committer et pousser les CSV mis à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weather_data_*.csv
          if git diff --cached --quiet; then
            echo "Rien à committer."
            exit 0
          fi
          git commit -m "Mise à jour automatique des données météo"

          # Un push manuel concurrent (ou un futur run qui chevaucherait
          # celui-ci) peut faire diverger la branche entre le checkout et
          # ce push : on retente avec rebase plutôt que de laisser le run
          # échouer et sauter la génération/publication du dashboard.
          max_attempts=5
          attempt=1
          while ! git push; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Échec du push après $max_attempts tentatives"
              exit 1
            fi
            echo "Push rejeté (tentative $attempt/$max_attempts), rebase sur origin/main puis nouvel essai..."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::Conflit lors du rebase sur origin/main (probablement un chevauchement sur les mêmes lignes de CSV) — intervention manuelle requise"
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep $((attempt * 3))
          done

      - name: Générer le dashboard
        run: |
          python3 generate_dashboard.py
          mkdir -p _site
          cp weather_dashboard.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
